description = "No Man's Sky 시작 시 업데이트 노트 페이지를 건너뜁니다."

[[patch]]
id = "patch-notes"
op = "write-bytes"
pattern = "83 b9 d8 0a 00 00 0c 4c 8b f2 48 8b f1 0f 84 ?? ?? ?? ?? 44 0f b6 0d ?? ?? ?? ?? 45 84 c9"
offset = 30
expect = "74"
bytes = "eb"
